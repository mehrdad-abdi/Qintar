name: Release

# Every merge to main builds a signed APK and publishes it as a GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :domain:test :data:testDebugUnitTest :app:testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QINTAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret QINTAR_KEYSTORE_BASE64 is not set; see docs/v2/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qintar.jks"

      - name: Build signed release APK
        env:
          QINTAR_KEYSTORE_FILE: ${{ runner.temp }}/qintar.jks
          QINTAR_KEYSTORE_PASSWORD: ${{ secrets.QINTAR_KEYSTORE_PASSWORD }}
          QINTAR_KEY_ALIAS: ${{ secrets.QINTAR_KEY_ALIAS }}
          QINTAR_KEY_PASSWORD: ${{ secrets.QINTAR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Read version
        id: version
        run: |
          name=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')
          code=$(grep -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          apk="qintar-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists; increase versionName and versionCode"
            exit 1
          fi
          files=("$apk")
          [ -f app/build/outputs/mapping/release/mapping.txt ] && files+=("app/build/outputs/mapping/release/mapping.txt")
          gh release create "$tag" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "Qintar ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --generate-notes
