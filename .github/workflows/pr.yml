name: Checks

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [v2]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quran-data:
    name: Quran database is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild quran.db from the checked-in sources and compare
        run: python3 -I tools/quran-data/build_quran_db.py --check

  version:
    name: versionCode is increased
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare versionCode with the base branch
        run: |
          code() { grep -oE 'versionCode *= *[0-9]+' | grep -oE '[0-9]+' | head -1; }
          head_code=$(code < app/build.gradle.kts)
          base_code=$(git show "origin/${{ github.base_ref }}:app/build.gradle.kts" | code || true)
          echo "base=${base_code:-none} head=$head_code"
          if [ -n "$base_code" ] && [ "$head_code" -le "$base_code" ]; then
            echo "::error::versionCode must be greater than $base_code (found $head_code)"
            exit 1
          fi

  test:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (domain, data)
        run: ./gradlew :domain:test :data:testDebugUnitTest --stacktrace
      # verifyRoborazziDebug is the app's testDebugUnitTest run with screenshot comparison on:
      # every app test runs once, and a screenshot that differs from app/src/test/screenshots fails it.
      - name: App unit tests and screenshot comparison (Roborazzi)
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug
      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qintar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
